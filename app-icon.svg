<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for modern look -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square (macOS style) -->
  <rect x="0" y="0" width="1024" height="1024" rx="226" fill="url(#bgGradient)"/>
  
  <!-- Globe/Universal symbol (background) -->
  <g opacity="0.15">
    <circle cx="512" cy="512" r="380" fill="none" stroke="#ffffff" stroke-width="24"/>
    <!-- Latitude lines -->
    <ellipse cx="512" cy="512" rx="380" ry="120" fill="none" stroke="#ffffff" stroke-width="16"/>
    <ellipse cx="512" cy="512" rx="380" ry="240" fill="none" stroke="#ffffff" stroke-width="16"/>
    <!-- Longitude line -->
    <ellipse cx="512" cy="512" rx="120" ry="380" fill="none" stroke="#ffffff" stroke-width="16"/>
  </g>
  
  <!-- Download arrow (main symbol) -->
  <g filter="url(#shadow)">
    <!-- Arrow shaft -->
    <rect x="462" y="280" width="100" height="340" rx="50" fill="url(#arrowGradient)"/>
    
    <!-- Arrow head (triangle) -->
    <path d="M 312 520 L 512 760 L 712 520 Z" fill="url(#arrowGradient)"/>
    
    <!-- Base line (where arrow lands) -->
    <rect x="312" y="740" width="400" height="32" rx="16" fill="url(#arrowGradient)"/>
  </g>
  
  <!-- Subtle shine effect -->
  <g opacity="0.2">
    <ellipse cx="512" cy="250" rx="300" ry="150" fill="#ffffff"/>
  </g>
</svg>
